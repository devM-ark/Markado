<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your Password</title>
<style>
  :root { --primary: #4D6A92; --accent: #5A8FA0; --border: #D7E1EA; --danger: #A3402F; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif; background: #F5F8FB;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 32px; max-width: 380px; width: 100%; }
  h1 { font-family: Arial, Helvetica, sans-serif; font-weight: 600; font-size: 1.4rem; margin-top: 0; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.85rem; color: #5C6773; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 3px; font-size: 1rem; }
  .btn { background: var(--primary); color: #fff; border: none; border-radius: 3px; padding: 11px 22px; font-size: 0.95rem; font-weight: 500; width: 100%; cursor: pointer; }
  .msg { padding: 10px 14px; border-radius: 3px; font-size: 0.9rem; margin-bottom: 16px; }
  .msg.error { background: #F7E4E0; color: var(--danger); }
  .msg.success { background: #E3EED4; color: #375534; }
</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="config.js"></script>
<script src="api.js"></script>
</head>
<body>
  <div class="card">
    <img src="assets/logo-banner2.svg" alt="Markado" style="max-width:250px; height:auto; display:block; margin:0 auto 20px;">
    <h1>Set a New Password</h1>
    <div id="msg"></div>
    <div id="form">
      <div class="field"><label>New Password</label><input id="newPassword" type="password"></div>
      <div class="field"><label>Confirm New Password</label><input id="confirmPassword" type="password"></div>
      <button class="btn" id="submitBtn">Reset Password</button>
    </div>
  </div>
  <script>
    var token = new URLSearchParams(window.location.search).get('token') || '';
    document.getElementById('submitBtn').onclick = function () {
      var p1 = document.getElementById('newPassword').value;
      var p2 = document.getElementById('confirmPassword').value;
      var msgEl = document.getElementById('msg');
      msgEl.innerHTML = '';
      if (!p1 || p1.length < 8) { msgEl.innerHTML = '<div class="msg error">Password must be at least 8 characters.</div>'; return; }
      if (p1 !== p2) { msgEl.innerHTML = '<div class="msg error">Passwords do not match.</div>'; return; }
      if (!token) { msgEl.innerHTML = '<div class="msg error">This link is missing its token — please use the link from your email.</div>'; return; }

      call('clientResetPassword_', [token, p1], function () {
        document.getElementById('form').style.display = 'none';
        msgEl.innerHTML = '<div class="msg success">Password reset. You can now log in with your new password.</div>';
      }, function (err) {
        msgEl.innerHTML = '<div class="msg error">' + err + '</div>';
      });
    };
  </script>
</body>
</html>
