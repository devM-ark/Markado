<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKADO: Online Grades Viewer - Teacher Login</title>
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  :root {
    --black: #0B0B0B;
	--white: #FFFFFF;
    --primary: #4D6A92;
	--accent: #5A8FA0;
    --surface: #F5F8FB;
	--border: #D7E1EA;
	--text-muted: #5C6773;
	--danger: #A3402F;
  }
  
  [data-theme="dark"] {
    --white: #14181D;
	--surface: #1B2027;
	--border: #2A313A;
	--text-muted: #9AA5B1;
	--black: #F2F4F6;
  }
  
  * { box-sizing: border-box; }
  
  body {
	margin: 0;
	font-family: Arial, Helvetica, sans-serif;
	color: var(--black);
	background: var(--surface);
  }
 	
  header {
    background: var(--primary);
    color: var(--white);
	height:76px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  h2, .display {
	font-weight: 600;
	letter-spacing: -0.01em;
  }
  
  .header-logo {
	height: 40px;
	width: auto;
	display: block;
	transform: scale(1.3);
	transform-origin: left center;
	}
  
  header .display {
	font-size: 1.3rem;
  }
  
  header nav {
	display: flex;
	gap: 20px;
	align-items: center;
	font-size: 0.9rem;
  }
  
  header nav a,
  header nav button {
    color: var(--white);
	background: none;
	border: none;
	text-decoration: none;
	opacity: 0.9;
	font-size: 0.9rem; }
	
  header nav a:hover,
  header nav button:hover {
	opacity: 1;
	text-decoration: underline;
  }
	
  .card {
	background: var(--white);
	border: 1px solid var(--border);
	border-radius: 4px;
	padding: 32px;
	max-width: 380px;
	width: 100%;
	margin: 40px auto;
  }
  
  .field {
	margin-bottom: 16px;
  }
  
  .field label {
	display: block;
	font-size: 0.85rem;
	color: var(--text-muted);
	margin-bottom: 6px;
  }
	
  .field input {
	width: 100%;
	padding: 10px 12px;
	border: 1px solid var(--border);
	border-radius: 3px;
	font-size: 1rem;
	font-family: inherit;
	background: var(--white);
	color: var(--black);
  }
	
  .field input:focus {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
  }
	
  button {
	font-family: inherit;
	cursor: pointer;
  }

  .btn {
	background: var(--primary);
	color: #fff;
	border: none;
	border-radius: 3px;
	padding: 11px 22px;
	font-size: 0.95rem;
	font-weight: 500;
	width: 100%;
  }
	
  .btn:hover {
	background: #3d5678;
  }
  
  .toggle-auth {
	text-align: center;
	margin-top: 16px;
	font-size: 0.9rem;
	color: var(--text-muted);
  }
  
  .toggle-auth button {
	background: none;
	border: none;
	color: var(--primary);
	text-decoration: underline;
	font-size: 0.9rem;
	padding: 0;
	cursor: pointer;
  }
	
  .msg {
	padding: 10px 14px;
	border-radius: 3px;
	font-size: 0.9rem;
	margin-bottom: 16px;
  }
	
  .msg.error {
	background: #F7E4E0;
	color: var(--danger);
  }
  
  .msg.success {
	background: #E3EED4;
	color: #375534;
  }
  
  .brand {
	text-align: center;
	margin-bottom: 20px;
  }
  
  .brand img {
	max-width: 220px;
	height: auto;
  }
  
  #registerFields {
	display: none;
  }

  .modal-overlay {
	position: fixed;
	inset: 0;
	background: rgba(0,0,0,0.5);
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 20px;
	z-index: 50;
  }

  .modal-overlay .card {
	margin: 0;
  }

  .pin-boxes {
	display: flex;
	justify-content: center;
	gap: 10px;
  }

  .pin-boxes input {
	width: 48px;
	height: 56px;
	padding: 0;
	border: 1px solid var(--border);
	border-radius: 3px;
	font-size: 1.4rem;
	text-align: center;
	font-family: inherit;
	background: var(--white);
	color: var(--black);
  }

  .pin-boxes input:focus {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
  }

</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>

<body>
<header>
  <a href="index.html">
  <img src="assets/logo-banner.svg" alt="Markado" class="header-logo">
  </a>
  <nav id="headerNav"></nav>
</header>

  <div class="card">
    <div class="brand">
	<img src="assets/logo-full.png" alt="Markado" onerror="this.style.display='none'">
	</div>
	
    <h2 id="authTitle">Sign In</h2>
    <div id="authMsg"></div>
	
    <form id="authForm">
      <div id="registerFields">
        <div class="field"><label>Full Name</label><input id="regFullName" type="text" autocomplete="name"></div>
      </div>
      <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
      <button class="btn" type="submit" id="authSubmit">Log In</button>
    </form>
    <div class="toggle-auth">
      <span id="toggleAuthText">New Here?</span>
      <button id="toggleAuthBtn">Create an Account.</button>
    </div>
    <div class="toggle-auth"><button id="forgotPasswordBtn">Forgot Password?</button></div>
  </div>

  <div id="confirmCodeOverlay" class="modal-overlay" style="display:none">
    <div class="card">
      <h2 style="margin-top:0">Confirm your Email</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-top:-8px">Enter the 4-digit code we emailed you. It expires in 5 minutes.</p>
      <div id="confirmCodeMsg"></div>
      <form id="confirmCodeForm">
        <div class="field">
          <div class="pin-boxes" data-hidden="confirmCodeInput">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          </div>
          <input type="hidden" id="confirmCodeInput">
        </div>
        <button class="btn" type="submit" id="confirmCodeBtn">Confirm</button>
      </form>
      <div class="toggle-auth"><button type="button" id="resendCodeBtn">Resend Code</button></div>
      <div class="toggle-auth"><button type="button" id="cancelCodeBtn">Cancel</button></div>
    </div>
  </div>

  <script>
    // Respects a dark-mode preference already chosen in the dashboard's Settings page.
    if (localStorage.getItem('markado_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    // Already logged in? Skip straight to the dashboard.
    if (localStorage.getItem('ogv_teacher_session')) {
      window.location.href = 'teacher.html';
    }

    var isRegisterMode = false;
    var pendingTeacherRegToken = null;

    // Same digit-box behavior as student.html's PIN entry: one digit per box, auto-advance,
    // Backspace retreats, paste distributes -- mirrored into the combined hidden input.
    function wirePinBoxes_(container) {
      var boxes = Array.prototype.slice.call(container.querySelectorAll('input'));
      var hidden = document.getElementById(container.dataset.hidden);
      function sync() { hidden.value = boxes.map(function (b) { return b.value; }).join(''); }
      boxes.forEach(function (box, i) {
        box.addEventListener('input', function () {
          box.value = box.value.replace(/\D/g, '').slice(-1);
          sync();
          if (box.value && boxes[i + 1]) boxes[i + 1].focus();
        });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !box.value && boxes[i - 1]) boxes[i - 1].focus();
        });
        box.addEventListener('paste', function (e) {
          var digits = (e.clipboardData.getData('text').match(/\d/g) || []).slice(0, boxes.length);
          if (!digits.length) return;
          e.preventDefault();
          digits.forEach(function (d, j) { if (boxes[j]) boxes[j].value = d; });
          sync();
          (boxes[digits.length] || boxes[boxes.length - 1]).focus();
        });
      });
    }
    document.querySelectorAll('.pin-boxes').forEach(wirePinBoxes_);

    function clearConfirmCodeBoxes_() {
      var group = document.querySelector('.pin-boxes[data-hidden="confirmCodeInput"]');
      group.querySelectorAll('input').forEach(function (b) { b.value = ''; });
      document.getElementById('confirmCodeInput').value = '';
    }

    function openConfirmCodeModal_() {
      document.getElementById('confirmCodeMsg').innerHTML = '';
      clearConfirmCodeBoxes_();
      document.getElementById('confirmCodeOverlay').style.display = 'flex';
      document.querySelector('#confirmCodeOverlay .pin-boxes input').focus();
    }

    function closeConfirmCodeModal_() {
      document.getElementById('confirmCodeOverlay').style.display = 'none';
      pendingTeacherRegToken = null;
    }

    document.getElementById('cancelCodeBtn').onclick = closeConfirmCodeModal_;

    document.getElementById('confirmCodeForm').onsubmit = function (e) {
      e.preventDefault();
      var code = document.getElementById('confirmCodeInput').value.trim();
      var msgEl = document.getElementById('confirmCodeMsg');
      msgEl.innerHTML = '';
      if (!/^\d{4}$/.test(code)) { msgEl.innerHTML = '<div class="msg error">Enter the 4-digit code.</div>'; return; }

      call('clientConfirmTeacherCode_', [pendingTeacherRegToken, code], function () {
        closeConfirmCodeModal_();
        document.getElementById('authMsg').innerHTML = '<div class="msg success">Your account is confirmed. You can now log in.</div>';
      }, function (err) {
        clearConfirmCodeBoxes_();
        document.querySelector('#confirmCodeOverlay .pin-boxes input').focus();
        msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>';
      }, { button: document.getElementById('confirmCodeBtn') });
    };

    document.getElementById('resendCodeBtn').onclick = function () {
      var msgEl = document.getElementById('confirmCodeMsg');
      call('clientResendTeacherCode_', [pendingTeacherRegToken], function (data) {
        pendingTeacherRegToken = data.pendingToken;
        clearConfirmCodeBoxes_();
        document.querySelector('#confirmCodeOverlay .pin-boxes input').focus();
        msgEl.innerHTML = '<div class="msg success">A new code has been sent.</div>';
      }, function (err) { msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>'; }, { button: document.getElementById('resendCodeBtn') });
    };

    document.getElementById('toggleAuthBtn').onclick = function () {
      isRegisterMode = !isRegisterMode;
      document.getElementById('registerFields').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('authTitle').textContent = isRegisterMode ? 'Create your Account' : 'Log In';
      document.getElementById('authSubmit').textContent = isRegisterMode ? 'Create Account' : 'Log In';
      document.getElementById('toggleAuthText').textContent = isRegisterMode ? 'Already have an Account?' : 'New Here?';
      document.getElementById('toggleAuthBtn').textContent = isRegisterMode ? 'Log In.' : 'Create an Account.';
      document.getElementById('authMsg').innerHTML = '';
    };

    // Enter key submits the form (native <form> submit behavior) —
    // intercepted here so it goes through the same handler as the button.
    document.getElementById('authForm').onsubmit = function (e) {
      e.preventDefault();
      submitAuthForm();
    };

    function submitAuthForm() {
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      var msgEl = document.getElementById('authMsg');
      msgEl.innerHTML = '';

      if (isRegisterMode) {
        var fullName = document.getElementById('regFullName').value.trim();
        if (!fullName || !email || !password) return;
        call('clientRegister_', [fullName, email, password], function (data) {
          // Clear credentials from the form now that they've been used —
          // nothing sensitive should linger in visible input fields.
          document.getElementById('regFullName').value = '';
          document.getElementById('authEmail').value = '';
          document.getElementById('authPassword').value = '';
          if (data && data.pendingToken) {
            pendingTeacherRegToken = data.pendingToken;
            openConfirmCodeModal_();
          } else {
            isRegisterMode = false;
            document.getElementById('toggleAuthBtn').click(); // this clears authMsg as a side effect -- message is set after, below
            msgEl.innerHTML = '<div class="msg success">' + escapeHtml((data && data.message) || 'Registered.') + '</div>';
          }
        }, function (err) { msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>'; }, { button: document.getElementById('authSubmit') });
      } else {
        if (!email || !password) return;
        call('clientLogin_', [email, password], function (data) {
          localStorage.setItem('ogv_teacher_session', data.sessionToken);
          // Clear credentials before navigating away — they should not sit
          // in the form if the user later hits "back" in their browser.
          document.getElementById('authEmail').value = '';
          document.getElementById('authPassword').value = '';
          window.location.href = 'teacher.html';
        }, function (err) { msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>'; }, { button: document.getElementById('authSubmit') });
      }
    }

    // Wake the Apps Script instance while the user types their details, so the login request
    // itself doesn't pay the cold-start delay. Silent: no spinner, errors ignored.
    call('clientPing_', [], function () {}, function () {}, { silent: true });

    document.getElementById('forgotPasswordBtn').onclick = function () {
      var email = prompt('Enter the email address on your account:');
      if (!email) return;
      call('clientRequestPasswordReset_', [email], function (data) {
        document.getElementById('authMsg').innerHTML = '<div class="msg success">' + escapeHtml(data.message) + '</div>';
      }, function () {
        document.getElementById('authMsg').innerHTML = '<div class="msg success">If that email is registered, a reset link has been sent.</div>';
      });
    };
  </script>
</body>
</html>
