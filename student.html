<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markado: Online Grades Viewer - Student</title>
<style>
  :root {
    --black: #0B0B0B;
    --white: #FFFFFF;
    --darkest: #0F2A1D;
    --primary: #375534;
    --accent: #6B9071;
    --light: #AEC3B0;
    --lightest: #E3EED4;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--black);
    background: var(--lightest);
    min-height: 100vh;
  }
  
  h1, h3, .display {
	font-family: Arial, Helvetica, sans-serif;
	font-weight: 500;
  }
  
  h2 {
	font-family: Arial, Helvetica, sans-serif;
	font-weight: 600;
  }
  
  button {
	font-family: inherit;
	cursor: pointer;
  }

  header {
    background: var(--darkest);
    color: var(--white);
	height:76px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .header-logo {
	height: 40px;
	width: auto;
	display: block;
	transform: scale(1.3);
	transform-origin: left center;
	margin-left: 0px;
  }
	
  header .display {
	font-size: 1.15rem;
  }
  
  header button {
	background: none;
	border: none;
	color: var(--white);
	opacity: 0.85;
	font-size: 0.85rem;
  }

  main {
	max-width: 480px;
	margin: 0 auto;
	padding: 24px 18px 60px;
  }

  /* The login form stays narrow at any width (a wide login card looks sparse, not "using the space well"), but
     the report has real tabular content to show, so on a laptop-sized screen it gets room to lay out flat
     instead of sitting in a phone-width column with a horizontal scrollbar despite the screen having space free.
     body.wide-view is toggled by show() below, only while the grades screen is the one on display. */
  @media (min-width: 760px) {
    body.wide-view main { max-width: 840px; }
  }
  
  .screen {
	display: none;
  }
  
  .screen.active {
	display: block;
  }

  .card {
    background: var(--white);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,42,29,0.08);
  }

  .field {
	margin-bottom: 16px;
  }
  
  .field label {
	display: block;
	font-size: 0.85rem;
	color: #555;
	margin-bottom: 6px;
  }
  
  .field input {
    width: 100%;
	padding: 12px 14px;
	border: 1px solid var(--light);
	border-radius: 6px;
	font-size: 1rem;
  }
  
  .field input:focus {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
  }

  .pin-boxes {
	display: flex;
	gap: 10px;
  }

  .pin-boxes input {
	width: 48px;
	height: 56px;
	padding: 0;
	border: 1px solid var(--light);
	border-radius: 6px;
	font-size: 1.4rem;
	text-align: center;
	-webkit-text-security: disc; /* dots like the old type="password" box, digit input still shows briefly on type */
  }

  .pin-boxes input:focus {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
  }

  .btn {
    background: var(--primary);
	color: var(--white);
	border: none;
	border-radius: 6px;
    padding: 13px 20px;
	font-size: 1rem;
	font-weight: 500;
	width: 100%;
  }
  
  .btn:hover {
	background: var(--darkest);
  }

  .msg {
	padding: 10px 14px;
	border-radius: 6px;
	font-size: 0.9rem;
	margin-bottom: 16px;
  }
  
  .msg.error {
	background: #F7E4E0;
	color: #A3402F;
  }

  .student-card {
	padding: 20px 22px;
  }
  
  .student-school {
	font-weight: 600;
	font-size: 1.05rem;
	color: var(--darkest);
  }
  
  .student-meta {
	color: #555;
	font-size: 0.88rem;
	margin-top: 2px;
  }
  
  .student-name {
	font-weight: 600;
	font-size: 1.15rem;
	margin-top: 12px;
  }
  
  .student-class {
	color: var(--primary);
	font-size: 0.95rem;
	margin-top: 2px;
  }

  .view-tabs {
	display: flex;
	gap: 8px;
	margin: 0 0 12px;
  }
  
  .view-tabs button {
    flex: 1;
	padding: 10px 12px;
	border: 1px solid var(--light);
	border-radius: 6px;
	background: var(--white);
    color: var(--darkest);
	font-size: 0.92rem;
  }
  
  .view-tabs button.active {
	background: var(--primary);
	color: var(--white);
	border-color: var(--primary);
  }
  
  .term-pick {
	margin: 0 0 12px;
  }
  
  .term-pick select {
	width: 100%;
	padding: 11px 12px;
	border: 1px solid var(--light);
	border-radius: 6px;
	font-size: 1rem;
	background: var(--white);
  }

  .grades-table {
	width: 100%;
	border-collapse: collapse;
	font-size: 0.92rem;
  }
  
  .grades-table th {
	text-align: center;
	font-size: 0.78rem;
	font-weight: 600;
	color: var(--primary);
	padding: 8px 4px;
	border: 1px solid var(--light);
  }
  
  .grades-table th:first-child,
  .grades-table td:first-child {
	text-align: left;
  }
  
  .grades-table td {
	padding: 12px 4px;
	border: 1px solid var(--light);
	text-align: center;
  }
  
  .grades-table .subj {
	font-weight: 500;
  }
  
  .grades-table .num {
	font-weight: 600;
	color: var(--darkest);
  }
  
  .grades-table .dash {
	color: #99a;
  }
  
  .grades-table .final {
	font-weight: 700;
	background: var(--lightest);
  }
  
  .grades-table .desc {
	text-align: left;
	font-size: 0.85rem;
	color: #444;
  }

  .grades-table .component-row .comp-name {
	padding-left: 22px;
	font-style: italic;
	font-weight: 400;
	color: #555;
	font-size: 0.88rem;
  }

  .grades-table .component-row td {
	padding-top: 6px;
	padding-bottom: 6px;
  }

  .grades-table .component-row td.num,
  .grades-table .component-row td.dash {
	font-style: italic;
	font-size: 0.85rem;
  }

  /* All Terms report only: the shared rules above (.subj/.num/.dash/.final/.desc/.component-row) still apply --
     these are just what's new here: a two-row header (Term spans 1/2/3), a Remarks column, section dividers for
     SHS Core/Elective/Special, and a closing General Average row. Table can be wider than the card on a phone,
     so it scrolls horizontally inside its own wrapper rather than forcing the whole page to. */
  .report-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* table-layout:auto (the default) sizes each column from its own cells' content, which is exactly why Term
     1/2/3 didn't come out identical (a blank MAPEH-component cell vs. a two-digit grade aren't the same width)
     and Final Grade -- bold, with a highlight background -- ran wider than it needed. Fixed layout makes every
     column's width a deliberate, explicit decision instead (via colgroup below) rather than one content forces
     on it. Learning Areas is the one column left unconstrained, so it's the one that absorbs the remaining
     space -- same technique as the teacher side's Male/Female tables. */
  .report-table { min-width: 560px; table-layout: fixed; }
  .report-table col.term-col { width: 42px; } /* all three identical */
  .report-table col.final-col { width: 56px; }
  .report-table col.desc-col { width: 88px; } /* fits "Benchmarking", the longest description band */
  .report-table col.remark-col { width: 76px; } /* fits "Promoted" / "Retained" */
  /* "Learning Areas" reads better centered like the rest of the header row; the subject names underneath read
     better left-aligned -- .grades-table's shared th:first-child rule left-aligns both, so this (same specificity,
     but naming both classes the element actually has makes the override unambiguous) undoes it for the header only. */
  .report-table.grades-table th:first-child { text-align: center; }
  /* One uniform divider works for both header rows at once: on a rowspan cell it lands at the true bottom of the
     whole header (the header/body boundary); on the plain "Term" and "1/2/3" cells it lands after their own row
     (between the two header rows, and between the second row and the body, respectively). */
  .report-table thead th { background: var(--darkest); color: #fff; border-color: rgba(255,255,255,0.3); }
  .report-table .remark { text-align: left; font-size: 0.85rem; color: #444; }
  .report-table .remark.pass { color: #2E5B3E; font-weight: 600; }
  .report-table .remark.fail { color: #A3402F; font-weight: 600; }
  .report-table tr.category-row td {
	background: var(--lightest);
	font-weight: 700;
	font-size: 0.78rem;
	text-transform: uppercase;
	letter-spacing: 0.03em;
	color: var(--primary);
	text-align: left;
  }
  .report-table tr.general-average-row td { font-weight: 700; background: #F2F6EE; }
  .report-table tr.general-average-row .ga-label { text-align: right; padding-right: 12px; }

  .report-footer { margin-top: 12px; }
  .report-mark { width: 24px; height: 24px; opacity: 0.85; }

  .report-header {
	text-align: center;
	margin-bottom: 4px;
  }

  .report-school {
	font-weight: 700;
	font-size: 1.05rem;
	text-transform: uppercase;
	color: var(--darkest);
	letter-spacing: 0.02em;
  }

  .report-year {
	font-size: 0.85rem;
	color: #555;
	margin-top: 2px;
  }

  .report-title {
	font-weight: 700;
	font-size: 0.95rem;
	color: var(--darkest);
	text-transform: uppercase;
	letter-spacing: 0.01em;
	margin-top: 14px;
  }

  .report-powered {
	font-size: 0.72rem;
	color: #888;
	font-style: italic;
	margin-top: 6px;
  }

  .report-brand {
	font-size: 0.8rem;
	font-weight: 700;
	color: var(--primary);
	margin-top: 1px;
  }

  /* Student Name / Grade Level side by side, LRN / Section side by side, Track / Cluster (SHS only) the same
     way, Class Adviser spanning both columns -- mirrors the printed Learner's Progress Report's layout. */
  .report-info-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	column-gap: 14px;
	row-gap: 5px;
	font-size: 0.84rem;
	margin-top: 14px;
  }

  .report-info-grid .full { grid-column: 1 / -1; }
  .report-info-grid .info-label { color: #666; }
  .report-info-grid .info-value { font-weight: 600; color: var(--darkest); margin-left: 4px; }
  .report-info-grid .info-spacer { grid-column: 1 / -1; height: 1em; }

  /* Pairing e.g. "Student Name" with "Grade Level" side by side gets cramped on a phone -- one column each keeps
     every value readable instead of wrapping mid-word. Matches the same mobile width main{} defaults to below. */
  @media (max-width: 480px) {
    .report-info-grid { grid-template-columns: 1fr; }
  }

  /* Desktop/laptop only: nudge Grade Level and Section further right, and deepen subject indents. */
  @media (min-width: 760px) {
    .report-info-grid .info-shift-right { margin-left: 1in; }
    .grades-table tr:not(.component-row) td.subj { padding-left: 1cm; }
    .grades-table .component-row .comp-name { padding-left: calc(22px + 1cm); }
  }

  .empty-state {
	text-align: center;
	padding: 48px 20px;
	color: #667;
  }
  
  .empty-state .display {
	font-size: 1.2rem;
	color: var(--black);
	margin-bottom: 8px;
  }
  
</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="config.js"></script>
<script src="api.js"></script>
</head>
<body>

<header>
  <a href="index.html">
  <img src="assets/logo-banner.svg" alt="Markado" class="header-logo">
  </a>
  <button id="logoutBtn" style="display:none">Log Out</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="screen-login" class="screen active">
    <div class="card" style="margin-top:20px">
      <h2 style="margin-top:0">Log In</h2>
      <p style="color:#555; font-size:0.9rem; margin-top:-8px">Enter your LRN and Surname.</p>
      <div id="loginMsg"></div>
      <form id="loginForm">
        <div class="field"><label>LRN</label><input id="lrnInput" inputmode="numeric" placeholder=""></div>
        <div class="field"><label>Surname</label><input id="surnameInput" placeholder=""></div>
        <button class="btn" type="submit" id="loginBtn">Log In</button>
      </form>
    </div>
  </section>

  <!-- PIN SETUP (first login only: LRN + surname matched, but no PIN exists yet) -->
  <section id="screen-pin-setup" class="screen">
    <div class="card" style="margin-top:20px">
      <h2 style="margin-top:0">Create a PIN</h2>
      <p style="color:#555; font-size:0.9rem; margin-top:-8px">Set a 4-digit PIN..</p>
      <div id="pinSetupMsg"></div>
      <form id="pinSetupForm">
        <div class="field">
          <label>New PIN</label>
          <div class="pin-boxes" data-hidden="pinSetupInput">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          </div>
          <input type="hidden" id="pinSetupInput">
        </div>
        <div class="field">
          <label>Confirm PIN</label>
          <div class="pin-boxes" data-hidden="pinSetupConfirmInput">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off">
          </div>
          <input type="hidden" id="pinSetupConfirmInput">
        </div>
        <button class="btn" type="submit" id="pinSetupBtn">Save PIN</button>
      </form>
      <p style="margin-top:14px"><a href="#" id="pinSetupBackLink" style="color:#667; font-size:0.85rem">&larr; Back</a></p>
    </div>
  </section>

  <!-- PIN VERIFY (every login after the first) -->
  <section id="screen-pin-verify" class="screen">
    <div class="card" style="margin-top:20px">
      <h2 style="margin-top:0">Enter your PIN</h2>
      <p style="color:#555; font-size:0.9rem; margin-top:-8px">Enter the 4-digit PIN.</p>
      <div id="pinVerifyMsg"></div>
      <form id="pinVerifyForm">
        <div class="field"><label>PIN</label><input id="pinVerifyInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>
        <button class="btn" type="submit" id="pinVerifyBtn">Continue</button>
      </form>
      <p style="color:#888; font-size:0.8rem; margin-top:14px">Forgot your PIN? Ask your teacher to reset it.</p>
      <p style="margin-top:6px"><a href="#" id="pinVerifyBackLink" style="color:#667; font-size:0.85rem">&larr; Back</a></p>
    </div>
  </section>

  <!-- GRADES -->
  <section id="screen-grades" class="screen">
    <div id="viewControls" style="display:none">
      <div class="view-tabs">
        <button id="viewAllBtn" class="active">All Terms</button>
        <button id="viewTermBtn">By Term</button>
      </div>
      <div class="term-pick" id="termPick" style="display:none">
        <select id="termSelect" aria-label="Choose a term">
          <option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option>
        </select>
      </div>
    </div>
    <div id="gradesContainer"></div>
  </section>

</main>

<script>
var sessionToken = sessionStorage.getItem('ogv_student_session') || null;

function show(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('wide-view', id === 'screen-grades');
}

// Wires a set of single-digit boxes to behave as one PIN field: typing a digit advances to the
// next box, Backspace on an empty box retreats to the previous one, and pasting a full PIN
// distributes it across the boxes. The combined digits are written into the existing hidden
// input (data-hidden) so the rest of the PIN setup/verify code didn't need to change at all.
function wirePinBoxes_(container) {
  var boxes = Array.prototype.slice.call(container.querySelectorAll('input'));
  var hidden = document.getElementById(container.dataset.hidden);

  function sync() {
    hidden.value = boxes.map(function (b) { return b.value; }).join('');
  }

  boxes.forEach(function (box, i) {
    box.addEventListener('input', function () {
      box.value = box.value.replace(/\D/g, '').slice(-1);
      sync();
      if (box.value && boxes[i + 1]) boxes[i + 1].focus();
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !box.value && boxes[i - 1]) boxes[i - 1].focus();
    });
    box.addEventListener('paste', function (e) {
      var digits = (e.clipboardData.getData('text').match(/\d/g) || []).slice(0, boxes.length);
      if (!digits.length) return;
      e.preventDefault();
      digits.forEach(function (d, j) { if (boxes[j]) boxes[j].value = d; });
      sync();
      (boxes[digits.length] || boxes[boxes.length - 1]).focus();
    });
  });
}
document.querySelectorAll('.pin-boxes').forEach(wirePinBoxes_);


function backToLogin_() {
  sessionStorage.removeItem('ogv_student_session');
  sessionToken = null;
  invalidateApiCache();
  gradesData = [];
  document.getElementById('viewControls').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  show('screen-login');
  return true;
}
window.onApiSessionExpired = backToLogin_;

if (!sessionToken) call('clientPing_', [], function () {}, function () {}, { silent: true });

// A matched LRN + surname no longer logs the student straight in -- see PIN SETUP / PIN VERIFY above -- it just
// hands back a short-lived pendingToken and which of those two screens comes next.
var pendingToken = null;

// Enter key submits the form (native <form> submit behavior) -- intercepted here so it goes through the same
// handler as tapping the button, same pattern as teacher-login.html's authForm.
document.getElementById('loginForm').onsubmit = function (e) {
  e.preventDefault();
  var lrn = document.getElementById('lrnInput').value.trim();
  var surname = document.getElementById('surnameInput').value.trim();
  var msgEl = document.getElementById('loginMsg');
  msgEl.innerHTML = '';
  if (!lrn || !surname) return;

  call('clientStudentLogin_', [lrn, surname], function (data) {
    pendingToken = data.pendingToken;
    if (data.stage === 'setup') {
      document.getElementById('pinSetupMsg').innerHTML = '';
      document.getElementById('pinSetupForm').reset();
      show('screen-pin-setup');
      document.querySelector('#pinSetupForm .pin-boxes input').focus();
    } else {
      document.getElementById('pinVerifyMsg').innerHTML = '';
      document.getElementById('pinVerifyForm').reset();
      show('screen-pin-verify');
    }
  }, function (err) {
    msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>';
  }, { button: document.getElementById('loginBtn') });
};

['pinSetupBackLink', 'pinVerifyBackLink'].forEach(function (id) {
  document.getElementById(id).onclick = function (e) {
    e.preventDefault();
    pendingToken = null; // abandoned, not invalidated server-side -- it just expires on its own shortly
    show('screen-login');
  };
});

document.getElementById('pinSetupForm').onsubmit = function (e) {
  e.preventDefault();
  var pin = document.getElementById('pinSetupInput').value.trim();
  var confirmPin = document.getElementById('pinSetupConfirmInput').value.trim();
  var msgEl = document.getElementById('pinSetupMsg');
  msgEl.innerHTML = '';
  if (!/^\d{4}$/.test(pin)) { msgEl.innerHTML = '<div class="msg error">Enter a 4-digit PIN.</div>'; return; }
  if (pin !== confirmPin) { msgEl.innerHTML = '<div class="msg error">Those two PINs don\'t match.</div>'; return; }

  call('clientCompleteStudentPinSetup_', [pendingToken, pin, confirmPin], function (data) {
    pendingToken = null;
    sessionToken = data.sessionToken;
    sessionStorage.setItem('ogv_student_session', sessionToken);
    afterLogin();
  }, function (err) {
    msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>';
  }, { button: document.getElementById('pinSetupBtn') });
};

document.getElementById('pinVerifyForm').onsubmit = function (e) {
  e.preventDefault();
  var pin = document.getElementById('pinVerifyInput').value.trim();
  var msgEl = document.getElementById('pinVerifyMsg');
  msgEl.innerHTML = '';
  if (!/^\d{4}$/.test(pin)) { msgEl.innerHTML = '<div class="msg error">Enter your 4-digit PIN.</div>'; return; }

  call('clientVerifyStudentPin_', [pendingToken, pin], function (data) {
    pendingToken = null;
    sessionToken = data.sessionToken;
    sessionStorage.setItem('ogv_student_session', sessionToken);
    afterLogin();
  }, function (err) {
    document.getElementById('pinVerifyInput').value = '';
    msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>';
  }, { button: document.getElementById('pinVerifyBtn') });
};

document.getElementById('logoutBtn').onclick = backToLogin_;

function afterLogin() {
  document.getElementById('logoutBtn').style.display = 'inline';
  loadGrades();
  show('screen-grades');
}

var gradesData = [];
var viewMode = 'all';
var selectedTerm = 1;

function termGrade_(subject, term) {
  var hit = subject.terms.filter(function (t) { return Number(t.term) === term; })[0];
  return hit || null;
}

function gradeCell_(value) {
  return value === null || value === undefined ? '<td class="dash">-</td>' : '<td class="num">' + escapeHtml(value) + '</td>';
}

/** "Dela Cruz, Juan M." -> surname bolded, rest normal -- the format asked for on the report. */
function studentNameHtml_(fullName) {
  var parts = String(fullName || '').split(',');
  if (parts.length < 2) return escapeHtml(fullName || '');
  var surname = parts[0].trim();
  var rest = parts.slice(1).join(',').trim();
  return '<b>' + escapeHtml(surname) + '</b>' + (rest ? ', ' + escapeHtml(rest) : '');
}

function isSHSGrade_(gradeLevel) {
  var n = parseInt(String(gradeLevel === undefined || gradeLevel === null ? '' : gradeLevel).replace(/[^0-9]/g, ''), 10);
  return n === 11 || n === 12;
}

var SUBJECT_CATEGORY_LABELS_ = { CORE: 'Core Subjects', ELECTIVE: 'Elective Subjects', SPECIAL: 'Special Subjects' };
var SUBJECT_CATEGORY_ORDER_ = ['CORE', 'ELECTIVE', 'SPECIAL'];

function infoRow_(label, valueHtml, full, extraClass) {
  var cls = [full ? 'full' : '', extraClass || ''].filter(Boolean).join(' ');
  return '<div' + (cls ? ' class="' + cls + '"' : '') + '><span class="info-label">' + escapeHtml(label) + ':</span><span class="info-value">' + valueHtml + '</span></div>';
}

function reportHeaderHtml_(e) {
  var isSHS = isSHSGrade_(e.gradeLevel);
  var rows =
    infoRow_('Student Name', studentNameHtml_(e.studentName)) +
    infoRow_('Grade Level', escapeHtml(e.gradeLevel || ''), false, 'info-shift-right') +
    infoRow_('LRN', escapeHtml(e.lrn || '')) +
    infoRow_('Section', escapeHtml(e.section || ''), false, 'info-shift-right') +
    (isSHS ? infoRow_('Track', escapeHtml(e.track || '')) + infoRow_('Cluster', escapeHtml(e.cluster || '')) : '') +
    '<div class="info-spacer"></div>' +
    infoRow_('Class Adviser', escapeHtml(e.adviserName || ''), true);

  return '<div class="report-header">' +
      (e.schoolName ? '<div class="report-school">' + escapeHtml(e.schoolName) + '</div>' : '') +
      (e.schoolYearLabel ? '<div class="report-year">School Year ' + escapeHtml(e.schoolYearLabel) + '</div>' : '') +
      '<div class="report-title">Learner&rsquo;s Progress Report</div>' +
      '<div class="report-powered">powered by</div>' +
      '<div class="report-brand">MARKADO: Online Grade Viewer</div>' +
    '</div>' +
    '<div class="report-info-grid">' + rows + '</div>';
}


/** "Passed"/"Promoted" read as good news, "Failed"/"Retained" as a flag -- everything else (blank, still pending) stays neutral. */
function remarkClass_(remark) {
  if (remark === 'Passed' || remark === 'Promoted') return 'remark pass';
  if (remark === 'Failed' || remark === 'Retained') return 'remark fail';
  return 'remark';
}

function finalCellHtml_(value) {
  return value === null || value === undefined ? '<td class="dash final">-</td>' : '<td class="num final">' + escapeHtml(value) + '</td>';
}

function subjectRowHtml_(s) {
  var cells = [1, 2, 3].map(function (n) { var t = termGrade_(s, n); return gradeCell_(t ? t.termGrade : null); }).join('');
  var mainRow = '<tr><td class="subj">' + escapeHtml(s.subjectName) + '</td>' + cells + finalCellHtml_(s.finalGrade) +
    '<td class="desc">' + escapeHtml(s.finalDescriptor || '') + '</td>' +
    '<td class="' + remarkClass_(s.remark) + '">' + escapeHtml(s.remark || '') + '</td></tr>';
  // MAPEH's two components ride along under the combined row, term grades only -- no Final Grade/Description/
  // Remarks of their own, same as the printed report (only the combined MAPEH row gets those).
  var componentRows = (s.components || []).map(function (c) {
    var ccells = [1, 2, 3].map(function (n) { var t = termGrade_(c, n); return gradeCell_(t ? t.termGrade : null); }).join('');
    return '<tr class="component-row"><td class="subj comp-name">' + escapeHtml(c.subjectName) + '</td>' + ccells + '<td></td><td></td><td></td></tr>';
  }).join('');
  return mainRow + componentRows;
}

function generalAverageRowHtml_(e) {
  return '<tr class="general-average-row"><td colspan="4" class="ga-label">General Average</td>' +
    finalCellHtml_(e.generalAverage) +
    '<td class="desc">' + escapeHtml(e.generalDescriptor || '') + '</td>' +
    '<td class="' + remarkClass_(e.generalRemark) + '">' + escapeHtml(e.generalRemark || '') + '</td></tr>';
}

function allTermsTable_(e) {
  var rows;
  if (isSHSGrade_(e.gradeLevel)) {
    // Senior High has no fixed subject list -- group Core ahead of Electives ahead of Special instead of
    // whatever order they were added in.
    var groups = { CORE: [], ELECTIVE: [], SPECIAL: [] };
    e.subjects.forEach(function (s) {
      var cat = groups[s.subjectCategory] ? s.subjectCategory : 'ELECTIVE'; // untagged (older) subjects default here
      groups[cat].push(s);
    });
    rows = SUBJECT_CATEGORY_ORDER_.filter(function (cat) { return groups[cat].length > 0; }).map(function (cat) {
      return '<tr class="category-row"><td colspan="7">' + SUBJECT_CATEGORY_LABELS_[cat] + '</td></tr>' +
        groups[cat].map(subjectRowHtml_).join('');
    }).join('');
  } else {
    rows = e.subjects.map(subjectRowHtml_).join('');
  }
  rows += generalAverageRowHtml_(e);
  // The colgroup is what actually pins each column's width under table-layout:fixed -- relying on the header
  // cells alone wouldn't reliably work here since the "Term" header itself is one colspan=3 cell, not 3 separate
  // ones (only the row below it, "1 2 3", has one cell per real column).
  return '<div class="report-table-wrap"><table class="grades-table report-table">' +
      '<colgroup><col><col class="term-col"><col class="term-col"><col class="term-col"><col class="final-col"><col class="desc-col"><col class="remark-col"></colgroup>' +
      '<thead>' +
      '<tr><th rowspan="2">Learning Areas</th><th colspan="3">Term</th><th rowspan="2">Final Grade</th><th rowspan="2">Description</th><th rowspan="2">Remarks</th></tr>' +
      '<tr><th>1</th><th>2</th><th>3</th></tr>' +
    '</thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="report-footer"><img class="report-mark" src="assets/favicon.svg" alt="" onerror="this.style.display=\'none\'"></div>';
}


function byTermTable_(e, term) {
  var rows = e.subjects.map(function (s) {
    var t = termGrade_(s, term);
    var mainRow = t ? '<tr><td class="subj">' + escapeHtml(s.subjectName) + '</td><td class="num">' + escapeHtml(t.termGrade) + '</td><td class="desc">' + escapeHtml(t.descriptor) + '</td></tr>' : '';
    var componentRows = (s.components || []).map(function (c) {
      var ct = termGrade_(c, term);
      return ct ? '<tr class="component-row"><td class="subj comp-name">' + escapeHtml(c.subjectName) + '</td><td class="num">' + escapeHtml(ct.termGrade) + '</td><td class="desc"></td></tr>' : '';
    }).join('');
    return mainRow + componentRows;
  }).join('');
  if (!rows) return '<p style="margin:0; color:#667; text-align:center">No Term ' + term + ' grades have been published yet.</p>';
  return '<table class="grades-table"><thead><tr><th>Subjects</th><th>Term ' + term + '</th><th style="text-align:left">Description</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderGrades_() {
  var container = document.getElementById('gradesContainer');
  container.innerHTML = '';
  gradesData.forEach(function (e) {
    if (e.subjects.length === 0) return;
    var header = document.createElement('div');
    header.className = 'card';
    header.innerHTML = reportHeaderHtml_(e);
    container.appendChild(header);

    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = viewMode === 'all' ? allTermsTable_(e) : byTermTable_(e, selectedTerm);
    container.appendChild(card);
  });
}

function setViewMode_(mode) {
  viewMode = mode;
  document.getElementById('viewAllBtn').classList.toggle('active', mode === 'all');
  document.getElementById('viewTermBtn').classList.toggle('active', mode === 'term');
  document.getElementById('termPick').style.display = mode === 'term' ? 'block' : 'none';
  renderGrades_();
}
document.getElementById('viewAllBtn').onclick = function () { setViewMode_('all'); };
document.getElementById('viewTermBtn').onclick = function () { setViewMode_('term'); };
document.getElementById('termSelect').onchange = function () { selectedTerm = Number(this.value); renderGrades_(); };

function loadGrades() {
  var container = document.getElementById('gradesContainer');
  document.getElementById('viewControls').style.display = 'none';
  setLoading(container, 'Loading your grades…');
  call('clientGetMyGrades_', [sessionToken], function (enrollments) {
    gradesData = enrollments;
    var anySubjects = enrollments.some(function (e) { return e.subjects.length > 0; });
    if (!anySubjects) {
      container.innerHTML =
        '<div class="empty-state"><div class="display">Nothing published yet</div>' +
        '<p>Your teacher hasn\'t published any grades yet. Check back later.</p></div>';
      return;
    }
    document.getElementById('viewControls').style.display = 'block';
    renderGrades_();
  }, function (err) {

    setErrorState(container, err, loadGrades);
  });
}

if (sessionToken) { afterLogin(); }
</script>
</body>
</html>
