<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markado: Online Grades Viewer - Student</title>
<style>
  :root {
    --black: #0B0B0B;
    --white: #FFFFFF;
    --darkest: #0F2A1D;
    --primary: #375534;
    --accent: #6B9071;
    --light: #AEC3B0;
    --lightest: #E3EED4;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--black);
    background: var(--lightest);
    min-height: 100vh;
  }
  
  h1, h3, .display {
	font-family: Arial, Helvetica, sans-serif;
	font-weight: 500;
  }
  
  h2 {
	font-family: Arial, Helvetica, sans-serif;
	font-weight: 600;
  }
  
  button {
	font-family: inherit;
	cursor: pointer;
  }

  header {
    background: var(--darkest);
    color: var(--white);
	height:76px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .header-logo {
	height: 40px;
	width: auto;
	display: block;
	transform: scale(1.3);
	transform-origin: left center;
	margin-left: 0px;
  }
	
  header .display {
	font-size: 1.15rem;
  }
  
  header button {
	background: none;
	border: none;
	color: var(--white);
	opacity: 0.85;
	font-size: 0.85rem;
  }

  main {
	max-width: 480px;
	margin: 0 auto;
	padding: 24px 18px 60px;
  }
  
  .screen {
	display: none;
  }
  
  .screen.active {
	display: block;
  }

  .card {
    background: var(--white);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,42,29,0.08);
  }

  .field {
	margin-bottom: 16px;
  }
  
  .field label {
	display: block;
	font-size: 0.85rem;
	color: #555;
	margin-bottom: 6px;
  }
  
  .field input {
    width: 100%;
	padding: 12px 14px;
	border: 1px solid var(--light);
	border-radius: 6px;
	font-size: 1rem;
  }
  
  .field input:focus {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
  }

  .btn {
    background: var(--primary);
	color: var(--white);
	border: none;
	border-radius: 6px;
    padding: 13px 20px;
	font-size: 1rem;
	font-weight: 500;
	width: 100%;
  }
  
  .btn:hover {
	background: var(--darkest);
  }

  .msg {
	padding: 10px 14px;
	border-radius: 6px;
	font-size: 0.9rem;
	margin-bottom: 16px;
  }
  
  .msg.error {
	background: #F7E4E0;
	color: #A3402F;
  }

  .student-card {
	padding: 20px 22px;
  }
  
  .student-school {
	font-weight: 600;
	font-size: 1.05rem;
	color: var(--darkest);
  }
  
  .student-meta {
	color: #555;
	font-size: 0.88rem;
	margin-top: 2px;
  }
  
  .student-name {
	font-weight: 600;
	font-size: 1.15rem;
	margin-top: 12px;
  }
  
  .student-class {
	color: var(--primary);
	font-size: 0.95rem;
	margin-top: 2px;
  }

  .view-tabs {
	display: flex;
	gap: 8px;
	margin: 0 0 12px;
  }
  
  .view-tabs button {
    flex: 1;
	padding: 10px 12px;
	border: 1px solid var(--light);
	border-radius: 6px;
	background: var(--white);
    color: var(--darkest);
	font-size: 0.92rem;
  }
  
  .view-tabs button.active {
	background: var(--primary);
	color: var(--white);
	border-color: var(--primary);
  }
  
  .term-pick {
	margin: 0 0 12px;
  }
  
  .term-pick select {
	width: 100%;
	padding: 11px 12px;
	border: 1px solid var(--light);
	border-radius: 6px;
	font-size: 1rem;
	background: var(--white);
  }

  .grades-table {
	width: 100%;
	border-collapse: collapse;
	font-size: 0.92rem;
  }
  
  .grades-table th {
	text-align: center;
	font-size: 0.78rem;
	font-weight: 600;
	color: var(--primary);
	padding: 8px 4px;
	border-bottom: 2px solid var(--lightest);
  }
  
  .grades-table th:first-child,
  .grades-table td:first-child {
	text-align: left;
  }
  
  .grades-table td {
	padding: 12px 4px;
	border-bottom: 1px solid var(--lightest);
	text-align: center;
  }
  
  .grades-table tr:last-child td {
	border-bottom: none;
  }
  
  .grades-table .subj {
	font-weight: 500;
  }
  
  .grades-table .num {
	font-weight: 600;
	color: var(--darkest);
  }
  
  .grades-table .dash {
	color: #99a;
  }
  
  .grades-table .final {
	font-weight: 700;
	background: var(--lightest);
  }
  
  .grades-table .desc {
	text-align: left;
	font-size: 0.85rem;
	color: #444;
  }

  .empty-state {
	text-align: center;
	padding: 48px 20px;
	color: #667;
  }
  
  .empty-state .display {
	font-size: 1.2rem;
	color: var(--black);
	margin-bottom: 8px;
  }
  
</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="config.js"></script>
<script src="api.js"></script>
</head>
<body>

<header>
  <a href="index.html">
  <img src="assets/logo-banner.svg" alt="Markado" class="header-logo">
  </a>
  <button id="logoutBtn" style="display:none">Log Out</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="screen-login" class="screen active">
    <div class="card" style="margin-top:20px">
      <h2 style="margin-top:0">Check Your Grades</h2>
      <p style="color:#555; font-size:0.9rem; margin-top:-8px">Enter your LRN and Surname.</p>
      <div id="loginMsg"></div>
      <div class="field"><label>LRN</label><input id="lrnInput" inputmode="numeric" placeholder=""></div>
      <div class="field"><label>Surname</label><input id="surnameInput" placeholder=""></div>
      <button class="btn" id="loginBtn">View my Grades</button>
    </div>
  </section>

  <!-- GRADES -->
  <section id="screen-grades" class="screen">
    <div id="viewControls" style="display:none">
      <div class="view-tabs">
        <button id="viewAllBtn" class="active">All Terms</button>
        <button id="viewTermBtn">By Term</button>
      </div>
      <div class="term-pick" id="termPick" style="display:none">
        <select id="termSelect" aria-label="Choose a term">
          <option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option>
        </select>
      </div>
    </div>
    <div id="gradesContainer"></div>
  </section>

</main>

<script>
var sessionToken = sessionStorage.getItem('ogv_student_session') || null;

function show(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}


function backToLogin_() {
  sessionStorage.removeItem('ogv_student_session');
  sessionToken = null;
  invalidateApiCache();
  gradesData = [];
  document.getElementById('viewControls').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  show('screen-login');
  return true;
}
window.onApiSessionExpired = backToLogin_;

if (!sessionToken) call('clientPing_', [], function () {}, function () {}, { silent: true });

document.getElementById('loginBtn').onclick = function () {
  var lrn = document.getElementById('lrnInput').value.trim();
  var surname = document.getElementById('surnameInput').value.trim();
  var msgEl = document.getElementById('loginMsg');
  msgEl.innerHTML = '';
  if (!lrn || !surname) return;

  call('clientStudentLogin_', [lrn, surname], function (data) {
    sessionToken = data.sessionToken;
    sessionStorage.setItem('ogv_student_session', sessionToken);
    afterLogin();
  }, function (err) {
    msgEl.innerHTML = '<div class="msg error">' + escapeHtml(err) + '</div>';
  }, { button: document.getElementById('loginBtn') });
};

document.getElementById('logoutBtn').onclick = backToLogin_;

function afterLogin() {
  document.getElementById('logoutBtn').style.display = 'inline';
  loadGrades();
  show('screen-grades');
}

var gradesData = [];
var viewMode = 'all';
var selectedTerm = 1;

function termGrade_(subject, term) {
  var hit = subject.terms.filter(function (t) { return Number(t.term) === term; })[0];
  return hit || null;
}

function gradeCell_(value) {
  return value === null || value === undefined ? '<td class="dash">—</td>' : '<td class="num">' + escapeHtml(value) + '</td>';
}


function allTermsTable_(e) {
  var rows = e.subjects.map(function (s) {
    var cells = [1, 2, 3].map(function (n) { var t = termGrade_(s, n); return gradeCell_(t ? t.termGrade : null); }).join('');
    var final = s.finalGrade === null || s.finalGrade === undefined ? '<td class="dash">—</td>' : '<td class="num final">' + escapeHtml(s.finalGrade) + '</td>';
    return '<tr><td class="subj">' + escapeHtml(s.subjectName) + '</td>' + cells + final + '</tr>';
  }).join('');
  return '<table class="grades-table"><thead><tr><th>Subjects</th><th>Term 1</th><th>Term 2</th><th>Term 3</th><th>Final Gr</th></tr></thead><tbody>' + rows + '</tbody></table>';
}


function byTermTable_(e, term) {
  var rows = e.subjects.map(function (s) {
    var t = termGrade_(s, term);
    return t ? '<tr><td class="subj">' + escapeHtml(s.subjectName) + '</td><td class="num">' + escapeHtml(t.termGrade) + '</td><td class="desc">' + escapeHtml(t.descriptor) + '</td></tr>' : '';
  }).join('');
  if (!rows) return '<p style="margin:0; color:#667; text-align:center">No Term ' + term + ' grades have been published yet.</p>';
  return '<table class="grades-table"><thead><tr><th>Subjects</th><th>Term ' + term + '</th><th style="text-align:left">Description</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderGrades_() {
  var container = document.getElementById('gradesContainer');
  container.innerHTML = '';
  gradesData.forEach(function (e) {
    if (e.subjects.length === 0) return;
    var header = document.createElement('div');
    header.className = 'card student-card';

    var lines = [['student-school', e.schoolName], ['student-meta', 'School Year ' + e.schoolYearLabel], ['student-name', e.studentName], ['student-class', 'Grade ' + e.gradeLevel + ' – ' + e.section]];
    lines.forEach(function (l) {
      if (!l[1] || /^School Year\s*$/.test(l[1])) return;
      var div = document.createElement('div');
      div.className = l[0];
      div.textContent = l[1];
      header.appendChild(div);
    });
    container.appendChild(header);

    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = viewMode === 'all' ? allTermsTable_(e) : byTermTable_(e, selectedTerm);
    container.appendChild(card);
  });
}

function setViewMode_(mode) {
  viewMode = mode;
  document.getElementById('viewAllBtn').classList.toggle('active', mode === 'all');
  document.getElementById('viewTermBtn').classList.toggle('active', mode === 'term');
  document.getElementById('termPick').style.display = mode === 'term' ? 'block' : 'none';
  renderGrades_();
}
document.getElementById('viewAllBtn').onclick = function () { setViewMode_('all'); };
document.getElementById('viewTermBtn').onclick = function () { setViewMode_('term'); };
document.getElementById('termSelect').onchange = function () { selectedTerm = Number(this.value); renderGrades_(); };

function loadGrades() {
  var container = document.getElementById('gradesContainer');
  document.getElementById('viewControls').style.display = 'none';
  setLoading(container, 'Loading your grades…');
  call('clientGetMyGrades_', [sessionToken], function (enrollments) {
    gradesData = enrollments;
    var anySubjects = enrollments.some(function (e) { return e.subjects.length > 0; });
    if (!anySubjects) {
      container.innerHTML =
        '<div class="empty-state"><div class="display">Nothing published yet</div>' +
        '<p>Your teacher hasn\'t published any grades yet. Check back later.</p></div>';
      return;
    }
    document.getElementById('viewControls').style.display = 'block';
    renderGrades_();
  }, function (err) {

    setErrorState(container, err, loadGrades);
  });
}

if (sessionToken) { afterLogin(); }
</script>
</body>
</html>
