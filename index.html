<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKADO: Online Grades Viewer</title>
<style>
  :root {
    --black: #0B0B0B;
    --white: #FFFFFF;
    --teacher-primary: #4D6A92;
    --teacher-accent: #5A8FA0;
    --student-primary: #375534;
    --student-accent: #6B9071;
    --student-light: #E3EED4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wordmark {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: -0.01em;
    text-align: center;
    margin-bottom: 8px;
  }
  .tagline {
    text-align: center;
    color: #555;
    font-size: 1rem;
    margin-bottom: 56px;
    max-width: 40ch;
  }
  .choices {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 640px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .choice {
    flex: 1 1 260px;
    text-decoration: none;
    color: var(--white);
    border-radius: 4px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.15s ease;
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-2px); }
  .choice:focus-visible { outline: 3px solid var(--black); outline-offset: 3px; }
  .choice.teacher { background: var(--teacher-primary); }
  .choice.student { background: var(--student-primary); }
  .choice-label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.5rem;
	text-align: center;
    font-weight: 700;
  }
  .choice-desc { font-size: 0.9rem; text-align: center; opacity: 0.85; }
  
  .developer-link {
	text-decoration: none;
  }
  footer {
    margin-top: 64px;
    font-size: 0.8rem;
    color: #555;
  }
  
</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <img src="assets/logo-banner2.svg" alt="Markado — Online Grades Viewer" style="max-width:90%; width:420px; height:auto; display:block; margin:0 auto;">
  <p class="tagline"></p>
  <div class="choices">
    <a class="choice teacher" href="teacher.html">
      <span class="choice-label">I'm a Teacher</span>
      <span class="choice-desc">Import or Manually Encode Grades</span>
    </a>
    <a class="choice student" href="student.html">
      <span class="choice-label">I'm a Student</span>
      <span class="choice-desc">View your Grades</span>
    </a>
  </div>
  <a href="https://m.me/RaymarkRemo" target="_blank" rel="noopener" title="Message Me on Messenger" class="developer-link">
  <footer>Developed by devM-ark.</footer>
</body>
</html>
